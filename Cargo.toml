[workspace]
resolver = "2"
members = [
    "apps/control",
    "apps/dns",
    "apps/edge",
    "crates/lagran-cache",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Lagran Team"]
license = "MIT"
repository = "https://github.com/your-org/lagran"

[workspace.dependencies]
# Pingora 0.9 uses tokio's BufStream with zero capacity; tokio 1.54 added an
# assert that breaks it. Pin until Pingora supports the newer behavior.
tokio = { version = "=1.53.1", features = ["full"] }
async-trait = "0.1"

axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "decompression-gzip"] }
hyper = { version = "1.1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full", "client-legacy"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "ring", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
rcgen = "0.13"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate"] }

jsonwebtoken = "9"
bcrypt = "0.15"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
dashmap = "5.5"
bytes = "1"
http = "1"

# Edge helpers (WebSocket handshake, HTTP-date parsing)
base64 = "0.22"
flate2 = "1"
httpdate = "1"
regex = "1"
ring = "0.17"
webpki-roots = "1"

lagran-cache = { path = "crates/lagran-cache" }
