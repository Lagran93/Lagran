[package]
name = "edge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lagran-edge"
path = "src/main.rs"

[lib]
name = "edge"
path = "src/lib.rs"

[features]
# Measurement-only seams (`*_for_measurement`) used by `examples/cc_rss_probe`.
#
# Off by default on purpose: the probe reproduces the pre-fix CC eviction rule,
# and a release build must not be *able* to do that — the seam used to exist in
# shipped code and was held back only by a doc comment saying "no data-plane
# caller". Compiling it out makes that a property of the build instead of a
# convention. `cargo run -p edge --example cc_rss_probe --features bench`.
bench = []

[[example]]
name = "cc_rss_probe"
required-features = ["bench"]

[dependencies]
lagran-cache = { workspace = true }
redis = { version = "0.27", features = [
    "tokio-comp",
    "connection-manager",
    "script",
    # Without TCP_NODELAY, Nagle + delayed ACK adds ~40 ms to a small
    # request/response every so often. `redis-cli --latency` (which sets the flag)
    # showed max 21 ms while the edge saw >50 ms timeouts: the extra delay was
    # Nagle, not the network.
    "tcp_nodelay",
] }

pingora = { version = "0.9.0", features = ["proxy", "openssl"] }
pingora-cache = "0.9.0"
# Static build friendliness (including musl): link a vendored OpenSSL.
openssl = { version = "0.10", features = ["vendored"] }

tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
hyper-rustls = { workspace = true }
rustls = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lagran-waf-dsl = { path = "../../crates/lagran-waf-dsl" }
maxminddb = "0.24"
regex = { workspace = true }
aho-corasick = "1.1"
tracing = { workspace = true }
dashmap = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
libc = "0.2"
http = { workspace = true }
async-trait = { workspace = true }
async-stream = "0.3"
dotenvy = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
brotli = { workspace = true }
zstd = { workspace = true }
httpdate = { workspace = true }
ring = { workspace = true }
webpki-roots = { workspace = true }
tikv-jemallocator = { workspace = true }
