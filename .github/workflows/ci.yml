name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  backend:
    name: Backend (test + release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --workspace
      - name: Release build
        env:
          LAGRAN_GIT_HASH: ${{ github.sha }}
        run: cargo build --release -p control -p edge -p lagran-dns
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: lagran-binaries
          if-no-files-found: error
          path: |
            target/release/lagran-control
            target/release/lagran-edge
            target/release/lagran-dns

  frontend:
    name: Frontend (static generate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install
        working-directory: apps/frontend
        run: npm ci
      - name: Generate
        working-directory: apps/frontend
        run: npm run generate
      - name: Upload web
        uses: actions/upload-artifact@v4
        with:
          name: lagran-web
          if-no-files-found: error
          path: apps/frontend/.output/public

  release:
    name: GitHub Release bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Build bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p stage/bin stage/web
          cp dist/lagran-binaries/lagran-control stage/bin/
          cp dist/lagran-binaries/lagran-edge stage/bin/
          cp dist/lagran-binaries/lagran-dns stage/bin/
          cp -a dist/lagran-web/. stage/web/
          cp control.env.example edge.env.example dns.env.example install.sh README.md stage/
          printf '%s\n' "${GITHUB_REF_NAME}" > stage/VERSION
          tar -C stage -czf "lagran-cdn-${VERSION}-linux-amd64.tar.gz" .
          sha256sum "lagran-cdn-${VERSION}-linux-amd64.tar.gz" > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lagran-cdn-*-linux-amd64.tar.gz
            SHA256SUMS
          generate_release_notes: true
