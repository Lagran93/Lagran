services:
  postgres:
    image: postgres:16-alpine
    container_name: lagran-postgres
    environment:
      POSTGRES_USER: lagran
      POSTGRES_PASSWORD: lagran
      POSTGRES_DB: lagran
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lagran"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # Pin 7.2 (BSD licensed). Redis 7.4+ uses RSALv2/SSPL; Valkey is an
    # API-compatible BSD alternative if licensing matters.
    image: redis:7.2-alpine
    container_name: lagran-redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-lagran-redis}",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-lagran-redis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: etcd for config center later
  # etcd:
  #   image: quay.io/coreos/etcd:v3.5.16
  #   ...

volumes:
  postgres_data:
  redis_data:
